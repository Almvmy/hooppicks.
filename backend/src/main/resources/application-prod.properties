server.port=${PORT:3001}

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

balldontlie.api-key=${BALLDONTLIE_API_KEY}
balldontlie.base-url=https://api.balldontlie.io

nba.sync.use-fixed-window=${NBA_SYNC_FIXED_WINDOW:false}
nba.sync.window-start=${NBA_SYNC_WINDOW_START:}
nba.sync.window-days=${NBA_SYNC_WINDOW_DAYS:10}

admin.api-key=${ADMIN_API_KEY}

# Port 465 (SSL implicite) plutôt que 587 (STARTTLS) : certains hébergeurs
# (Railway inclus) bloquent le 587 en sortie pour limiter le spam — le 465
# passe plus souvent. Si SPRING_MAIL_PORT est déjà fixé à 587 sur Railway,
# il faut le changer là-bas aussi (cette valeur par défaut ne s'applique que
# si la variable n'est pas définie).
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail-from=${APP_MAIL_FROM}

deepl.api-key=${DEEPL_API_KEY}
deepl.api-url=https://api-free.deepl.com/v2/translate

app.frontend-url=${APP_FRONTEND_URL:https://hooppicks.vercel.app}
app.cookie-same-site=None
app.cookie-secure=true