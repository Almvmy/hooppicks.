server.port=${PORT:3001}

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

balldontlie.api-key=${BALLDONTLIE_API_KEY}
balldontlie.base-url=https://api.balldontlie.io

nba.sync.use-fixed-window=${NBA_SYNC_FIXED_WINDOW:false}
nba.sync.window-start=${NBA_SYNC_WINDOW_START:}
nba.sync.window-days=${NBA_SYNC_WINDOW_DAYS:10}

admin.api-key=${ADMIN_API_KEY}

# API HTTP Brevo plutôt que SMTP : Railway bloque les ports SMTP sortants
# (587 et 465 testés, timeout systématique) : l'API HTTP passe par le 443
# comme n'importe quel autre appel externe, jamais bloquée pareil.
brevo.api-key=${BREVO_API_KEY}
app.mail-from=${APP_MAIL_FROM}

deepl.api-key=${DEEPL_API_KEY}
deepl.api-url=https://api-free.deepl.com/v2/translate

app.frontend-url=${APP_FRONTEND_URL:https://hooppicks.vercel.app}
app.cookie-same-site=None
app.cookie-secure=true

# Optionnel : si absent, Sentry.init() avec un DSN vide désactive le SDK
# proprement (cf. SentryConfig), pas d'erreur au démarrage.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=production